services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: waifuletes-api
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MEDIA_DIR=/app/media
    volumes:
      - ./media:/app/media
      - ${CHARACTERS_DIR:-./media/characters}:/app/media/characters:ro
      - ./api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - waifuletes-net

  postgres:
    image: postgres:16-alpine
    container_name: waifuletes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waifuletes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-waifuletes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waifuletes} -d ${POSTGRES_DB:-waifuletes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waifuletes-net

  redis:
    image: redis:7-alpine
    container_name: waifuletes-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waifuletes-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: waifuletes-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    networks:
      - waifuletes-net
    profiles:
      - tunnel

volumes:
  postgres_data:
  redis_data:

networks:
  waifuletes-net:
    driver: bridge
